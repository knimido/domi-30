 ['Beat the clock','Get your team and station ready. Tap Start, complete the station task, then tap Stop. You can reset before submitting.','The fastest time wins. Once submitted, your result is locked. A confirmed reset lets you retry if you mis-tapped.'],

];
let state = null, auth = {}, hostKey = '', hostSettings = null, route = 'home', challenge = 1, busy = false;
let lastActionButton = null;
document.addEventListener('click',e=>{lastActionButton=e.target.closest('button');},true);

let boardImmersive=false;

function storage(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}return null;}
try{auth=JSON.parse(storage('party-v2-team')||'{}');}catch(e){auth={};}
const uid = () => typeof crypto.randomUUID==='function' ? crypto.randomUUID() : 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
function me(){return state && state.teams.find(t=>t.id===auth.teamId);}

function rpc(action,p={}){return PartyTransport.call(action,p);}

function accept(data){
 if(!data||!data.teams)return;
 const changedEpoch=state&&state.epoch!==data.epoch;
 const finishedChanged=state&&state.settings.finished!==data.settings.finished;
 const submissionsChanged=state&&state.settings.showSubmissions!==data.settings.showSubmissions;
 const visibilityChanged=state&&state.settings.leaderboardVisible!==data.settings.leaderboardVisible;
 const oldScore=me()?.scores[challenge];
 // Ignore a slow polling response that predates a completed write on this phone.
 if(state && data.revision < state.revision)return;
 const {hostSettings:privateSettings,...publicData}=data;
 state=publicData;state.url=new URL('./',location.href).href;
 if(privateSettings)hostSettings=privateSettings;
 $('connection').textContent='Connected · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 if(auth.teamId&&!me()){auth={};storage('party-v2-team',null);if(!route.startsWith('host')&&route!=='board')go('home');}
 if(finishedChanged&&route==='game'){stopActivity();renderGame();}if(submissionsChanged&&route==='board'&&!$('overlay').classList.contains('hidden'))closeOverlay();if(submissionsChanged&&route==='board')renderBoard();if(visibilityChanged&&!hostKey){if(route==='board'){closeOverlay();renderBoard();}if(data.settings.leaderboardVisible)toast('Domi revealed the leaderboard! Take a look when you’re ready.');}
 if(!busy&&!changedEpoch&&route==='game'&&JSON.stringify(oldScore)!==JSON.stringify(me()?.scores[challenge])){stopActivity();if(me()?.scores[challenge])renderCompleted();else beginChallenge();}

function myVersion(c=challenge){const t=me();return t?.scores[c]?.version||t?.attemptVersions?.[c]||0;}
function stateCredentials(){return {...auth,...(hostKey?{key:hostKey}:{})};}

async function uploadSharedAudio(file,slot){if(!file)return;const sessionId=audioRound.id,uploadId=uid();await task(async()=>{const button=$('audioUploadStatus');button.textContent='Preparing recording…';const base64=await prepareAudioWav(file);button.textContent='Uploading to your team…';button.insertAdjacentHTML('beforeend','<span class="spinner"></span>');const d=await rpc('audioUpload',audioParams({sessionId,slot,base64,requestId:uploadId}));receiveAudio(d,true);toast('Recording sent to your teammate.');},$('audioUploadStatus'));}

async function playSharedAudio(slot){const key=audioRound.id+':'+slot,ctx=await prepareSound();if(!buffers[key]){const d=await rpc('audioClip',audioParams({slot}));if(d.sessionId!==audioRound?.id)throw Error('The audio round changed.');const bytes=Uint8Array.from(atob(d.base64),c=>c.charCodeAt(0)),decoded=await ctx.decodeAudioData(bytes.buffer),reverse=ctx.createBuffer(decoded.numberOfChannels,decoded.length,decoded.sampleRate);for(let c=0;c<decoded.numberOfChannels;c++)reverse.getChannelData(c).set(Float32Array.from(decoded.getChannelData(c)).reverse());buffers[key]=reverse;}if(audioSource)try{audioSource.stop();}catch(e){}audioSource=ctx.createBufferSource();audioSource.buffer=buffers[key];audioSource.playbackRate.value=playbackSpeed;audioSource.connect(soundOutput());audioSource.start();}
