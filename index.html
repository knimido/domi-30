async function toggleRecording(slot){
 if(recorder?.state==='recording'){recorder.stop();return;}
 if(recordBusy||busy)return;
 const generation=++recordGeneration;recordBusy=true;
 const button=$('recordDirect');buttonLoading(button,true);
 try{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Recording needs Safari or Chrome on the HTTPS GitHub website. You can also upload an audio file.');
  stopSpeech();audioSessionType('play-and-record');const streamPromise=navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  streamPromise.then(stream=>{if(generation!==recordGeneration)stream.getTracks().forEach(t=>t.stop());}).catch(()=>{});
  const stream=await timeoutWork(streamPromise,30000,'Microphone permission timed out. Tap Record and allow microphone access.');
  if(generation!==recordGeneration){stream.getTracks().forEach(t=>t.stop());return;}micStream=stream;
  const type=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);recordChunks=[];recordStarted=performance.now();
  recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data);};
  recorder.onerror=()=>{cancelRecording();toast('Recording interrupted. Try again.');if($('recorderControls'))renderRecorder(slot);};
  recorder.onstop=async()=>{const blob=new Blob(recordChunks,{type:recorder.mimeType});releaseMic();recorder=null;if(generation===recordGeneration)await prepareRecording(blob,slot,true);};
  recorder.start();postAudioStatus('recording');recordDraft=null;renderRecorder(slot);
  recordTimer=setInterval(()=>{if($('recordTime'))$('recordTime').textContent=((performance.now()-recordStarted)/1000).toFixed(1)+' s / 30 s';},100);
  recordLimit=setTimeout(()=>{if(recorder?.state==='recording')recorder.stop();},29500);
 }catch(e){if(generation===recordGeneration){recordGeneration++;recordBusy=false;releaseMic();toast(e.name==='NotAllowedError'?'Microphone permission was denied. Allow it in the browser’s site settings, then tap Record.':e.message);}}
 finally{if(generation===recordGeneration)recordBusy=false;buttonLoading(button,false);}
}
async function prepareRecording(file,slot,fromMic=false){
 if(!file)return;const key=recordingKey(slot),generation=recordGeneration;
 await task(async()=>{
  recordBusy=true;document.querySelectorAll('#recorderControls button,#recorderControls input,#sendRecording').forEach(el=>el.disabled=true);const status=$('audioUploadStatus');if(status)status.textContent='Preparing recording…';
  try{const base64=await timeoutWork(prepareAudioWav(file),20000,'This recording could not be prepared. Try recording again, or upload a short M4A/WAV file.');
   if(key!==recordingKey(slot)||generation!==recordGeneration)return;
   recordDraft={key,base64,requestId:uid()};postAudioStatus('ready');renderRecorder(slot);
  }catch(e){if($('recorderControls'))renderRecorder(slot);throw e;}finally{recordBusy=false;if($('audioUploadStatus'))$('audioUploadStatus').textContent='';}
 },$('recordDirect'));
}

   * @param unicodeData base64 string of byte array.

        var b = bin.read();

      var unicodeMap = {};

        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

        throw count + ' != ' + numChars;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {

              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

        ^ EXP_TABLE[i - 6]

    _this.gexp = function(n) {

      while (n < 0) {
        n += 255;

      while (n >= 256) {

      return EXP_TABLE[n];

    return _this;
  }();

      var num = new Array(_this.getLength() + e.getLength() - 1);

      for (var i = 0; i < _this.getLength(); i += 1) {
        for (var j = 0; j < e.getLength(); j += 1) {
          num[i + j] ^= QRMath.gexp(QRMath.glog(_this.getAt(i) ) + QRMath.glog(e.getAt(j) ) );
        }

      return qrPolynomial(num, 0);

    _this.mod = function(e) {

      if (_this.getLength() - e.getLength() < 0) {
        return _this;
      }

      var ratio = QRMath.glog(_this.getAt(0) ) - QRMath.glog(e.getAt(0) );

      var num = new Array(_this.getLength() );
      for (var i = 0; i < _this.getLength(); i += 1) {
        num[i] = _this.getAt(i);

      for (var i = 0; i < e.getLength(); i += 1) {
        num[i] ^= QRMath.gexp(QRMath.glog(e.getAt(i) ) + ratio);

      return qrPolynomial(num, 0).mod(e);
    };

    return _this;
  };
